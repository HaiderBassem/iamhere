# Production-shaped single-server stack. Only Caddy publishes ports; Postgres and
# the API live on a private network. Copy .env.example to .env and fill it in.
# On arm64 dev machines set POSTGIS_IMAGE=imresamu/postgis:17-3.5-bookworm.
name: iamhere

services:
  db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:17-3.5}
    restart: unless-stopped
    environment:
      POSTGRES_DB: iamhere
      POSTGRES_USER: iamhere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iamhere -d iamhere"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    build: ../apps/api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      IAH_ENV: production
      IAH_LISTEN: ":8080"
      IAH_DATABASE_URL: postgres://iamhere:${POSTGRES_PASSWORD}@db:5432/iamhere?sslmode=disable
      IAH_PUBLIC_URL: https://${IAH_DOMAIN:?set IAH_DOMAIN}
      IAH_TRUST_PROXY: "1" # only Caddy can reach the API; rate limits use the client IP it forwards
      IAH_SMTP_URL: ${IAH_SMTP_URL:-}
      IAH_MAIL_FROM: ${IAH_MAIL_FROM:-}
      IAH_CORS_ORIGINS: ${IAH_CORS_ORIGINS:-}
      IAH_VISION_URL: http://vision:8090
    networks: [private]
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    logging: *logs

  # Strict mode's photo check (room recognition + reading the code in the
  # photo). Internal only; the API is its sole client. CPU only, ~1 core per
  # concurrent check; raise IAH_VISION_WORKERS and cpus together.
  vision:
    build: ../apps/vision
    restart: unless-stopped
    environment:
      IAH_VISION_WORKERS: ${IAH_VISION_WORKERS:-2}
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: ${IAH_VISION_CPUS:-2}
    logging: *logs

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["80:80", "443:443"]
    environment:
      IAH_DOMAIN: ${IAH_DOMAIN:?set IAH_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/web/public:/srv/web:ro
      - caddy_data:/data
    networks: [private]
    logging: *logs

networks:
  private: {}

volumes:
  pgdata: {}
  caddy_data: {}
