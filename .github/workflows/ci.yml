name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: tests (race detector, real PostGIS)
        run: go test -race -count=1 ./...

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: build API image
        run: docker build -t iamhere-api apps/api
      - name: compose config validates
        working-directory: infra
        env:
          POSTGRES_PASSWORD: ci
          IAH_DOMAIN: ci.example.org
          IAH_OIDC_ISSUER: https://auth.example.org/realms/iamhere
          IAH_OIDC_CLIENT_ID: iamhere-web
          IAH_AUTH_ORIGIN: https://auth.example.org
        run: docker compose config -q
      - name: Caddyfile is valid
        run: |
          docker run --rm -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e IAH_DOMAIN=ci.example.org -e IAH_AUTH_ORIGIN=https://auth.example.org \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile

  web:
    # End-to-end tests of the web app in a real browser: organizers and attendees
    # on separate phones, a fake camera playing real scenes, mocked GPS, the live
    # QR decoded from the screen exactly as a phone camera would.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: build and start the API (serves the web app, dev sign-in)
        run: |
          (cd apps/api && go build -o "$RUNNER_TEMP/iah-api" ./cmd/api)
          IAH_DEV_AUTH=1 IAH_LISTEN=:8080 IAH_WEB_DIR="$PWD/apps/web/public" \
            IAH_DATABASE_URL='postgres://postgres:dev@localhost:5432/postgres?sslmode=disable' \
            "$RUNNER_TEMP/iah-api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8080/readyz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: install browser
        working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium
      - name: end-to-end tests
        working-directory: apps/web
        env:
          BASE_URL: http://localhost:8080
          SHOTS: ${{ runner.temp }}/shots
        run: npm run e2e
      - name: sign-in end-to-end (OIDC code + PKCE, refresh, logout; mock identity provider)
        working-directory: apps/web
        env:
          API_BIN: ${{ runner.temp }}/iah-api
          DATABASE_URL: postgres://postgres:dev@localhost:5432/iamhere_oidc?sslmode=disable
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -c 'CREATE DATABASE iamhere_oidc'
          npm run e2e:oidc
      - name: API log (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7
