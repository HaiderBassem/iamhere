name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: tests (race detector, real PostGIS)
        run: go test -race -count=1 ./...

  vision:
    # The photo check of strict mode: QR reading, room recognition, the HTTP protocol.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/vision/requirements*.txt
      - name: install (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install -r requirements-dev.txt
      - name: tests
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: build API image
        run: docker build -t iamhere-api apps/api
      - name: build vision image (loads the models at build time)
        run: docker build -t iamhere-vision apps/vision
      - name: compose config validates
        working-directory: infra
        env:
          POSTGRES_PASSWORD: ci
          IAH_DOMAIN: ci.example.org
        run: docker compose config -q
      - name: Caddyfile is valid
        run: |
          docker run --rm -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e IAH_DOMAIN=ci.example.org \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile

  web:
    # End-to-end tests of the web app in a real browser: organizers and attendees
    # on separate phones, a fake camera playing generated rooms (with the live code
    # on their screen), mocked GPS, the real vision service checking the photos.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/vision/requirements*.txt
      - name: install and start the vision service
        working-directory: apps/vision
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install -r requirements-dev.txt
          IAH_VISION_LISTEN=127.0.0.1:8090 IAH_VISION_WORKERS=2 python -m iahvision.server > "$RUNNER_TEMP/vision.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8090/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/vision.log"; exit 1
      - name: build and start the API (serves the web app; account emails go to a folder)
        run: |
          (cd apps/api && go build -o "$RUNNER_TEMP/iah-api" ./cmd/api)
          IAH_LISTEN=:8080 IAH_WEB_DIR="$PWD/apps/web/public" IAH_VISION_URL=http://127.0.0.1:8090 IAH_MAIL_DIR="$RUNNER_TEMP/mail" \
            IAH_DATABASE_URL='postgres://postgres:dev@localhost:5432/postgres?sslmode=disable' \
            "$RUNNER_TEMP/iah-api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8080/readyz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: install browser
        working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium
      - name: end-to-end tests
        working-directory: apps/web
        env:
          BASE_URL: http://localhost:8080
          SHOTS: ${{ runner.temp }}/shots
          VISION_PYTHON: python
          MAIL_DIR: ${{ runner.temp }}/mail
        run: npm run e2e
      - name: rendered design check (docs/DESIGN.md)
        working-directory: apps/web
        env:
          BASE_URL: http://localhost:8080
          OUT: ${{ runner.temp }}/shots/design
        run: npm run design
      - name: API and vision logs (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/vision.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7
