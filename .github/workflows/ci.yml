name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: tests (race detector, real PostGIS)
        run: go test -race -count=1 ./...

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: build API image
        run: docker build -t iamhere-api apps/api
      - name: compose config validates
        working-directory: infra
        env:
          POSTGRES_PASSWORD: ci
          IAH_DOMAIN: ci.example.org
          IAH_OIDC_ISSUER: https://auth.example.org/realms/iamhere
          IAH_OIDC_CLIENT_ID: iamhere-web
        run: docker compose config -q
